<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Morton Coursework</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="coursework.css" />
</head>
<body>

  <main class="page">

    <header class="site-header">
      <div>
        <h1>All Coursework</h1>
        <p class="course-count" id="course-count" aria-live="polite"></p>
      </div>
      <a href="../index.html" class="back-link">&larr; Portfolio</a>
    </header>

    <div class="filters" aria-label="Filter Coursework">
      <div class="filter" data-key="university">
        <span class="filter-label" id="label-university">University</span>
        <button type="button" class="filter-toggle" aria-haspopup="true" aria-expanded="false" aria-labelledby="label-university">All</button>
        <div class="filter-menu" hidden>
          <div class="filter-options" role="group" aria-labelledby="label-university"></div>
          <button type="button" class="filter-clear">Clear</button>
        </div>
      </div>
      <div class="filter" data-key="department">
        <span class="filter-label" id="label-department">Department</span>
        <button type="button" class="filter-toggle" aria-haspopup="true" aria-expanded="false" aria-labelledby="label-department">All</button>
        <div class="filter-menu" hidden>
          <div class="filter-options" role="group" aria-labelledby="label-department"></div>
          <button type="button" class="filter-clear">Clear</button>
        </div>
      </div>
      <div class="filter" data-key="roles">
        <span class="filter-label" id="label-roles">Role</span>
        <button type="button" class="filter-toggle" aria-haspopup="true" aria-expanded="false" aria-labelledby="label-roles">All</button>
        <div class="filter-menu" hidden>
          <div class="filter-options" role="group" aria-labelledby="label-roles"></div>
          <button type="button" class="filter-clear">Clear</button>
        </div>
      </div>
      <div class="filter" data-key="skills">
        <span class="filter-label" id="label-skills">Skills</span>
        <button type="button" class="filter-toggle" aria-haspopup="true" aria-expanded="false" aria-labelledby="label-skills">All</button>
        <div class="filter-menu" hidden>
          <div class="filter-options" role="group" aria-labelledby="label-skills"></div>
          <button type="button" class="filter-clear">Clear</button>
        </div>
      </div>
    </div>

    <div class="course-list" id="course-list">
      <!-- Coursework cards injected here by JS -->
    </div>

  </main>

  <footer>
    <p>&copy; 2025 Alexander Morton</p>
    <p class="footer-note">Logos are trademarks of their respective universities and are used here for educational reference only</p>
  </footer>

  <script src="coursework.js"></script>
</body>
</html>
